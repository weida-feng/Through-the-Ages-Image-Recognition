[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tta-image-pipeline"
version = "0.1.0"
description = "A personal Through the Ages screenshot recognition and data-quality project."
authors = [{name = "Weida Feng"}]
readme = "README.md"
# Legacy file form preserves compatibility with the Python 3.8 build tools.
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["numpy>=1.19"]
vision = ["numpy>=1.19", "opencv-python>=4.5", "scikit-learn>=0.24", "joblib>=1.0"]
analysis = ["pandas>=2.0", "openpyxl>=3.1"]
plots = ["matplotlib>=3.7,<4"]
capture = ["pyautogui>=0.9", "pyperclip>=1.8", "pydirectinput>=1.0; sys_platform == 'win32'"]

[project.scripts]
tta-pipeline = "tta_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSE_SCOPE.md", "THIRD_PARTY.md"]

[tool.ruff]
target-version = "py38"
line-length = 100

