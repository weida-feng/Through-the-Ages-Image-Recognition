name: Public sample checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify public file manifest
        run: python scripts/public_manifest.py --check
      - name: Install analysis dependencies
        run: |
          python -m pip install -r requirements/analysis.txt
          python -m pip install --no-deps -e .
      - name: Check units and public data
        run: python -m unittest discover -s tests -v
      - name: Run the public analysis example
        run: python examples/analyze_sample.py --output results/ci-demo
